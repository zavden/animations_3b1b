<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3b1b en ManimGL</title>
<style>
:root {
  --bg: #0d0f12;
  --panel: #15181d;
  --panel-2: #1c2027;
  --line: #2a2f38;
  --text: #e6e8eb;
  --muted: #8b93a1;
  --accent: #58c4dd;
  --c1: #5fbf7f;
  --c2: #58c4dd;
  --c3: #e2645a;
  --c4a: #b48ce8;
  --c4b: #7d6a99;
  --cpending: #6b7280;
  --cerror: #e3a14d;
  --cbase: #4b5563;
  --add: #1f3b2a;
  --del: #45201f;
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="light"] {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #eef0f3;
  --line: #d9dde3;
  --text: #1b1f24;
  --muted: #5d6673;
  --accent: #1f86a3;
  --add: #dff3e6;
  --del: #fbe3e1;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); }
header {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 12px 20px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .2px; }
header h1 span { color: var(--muted); font-weight: 400; }
header .navlink { color: var(--accent); text-decoration: none; font-size: 13px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12.5px;
  display: inline-flex; gap: 6px; align-items: center; user-select: none;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.off { opacity: .38; }
input[type=search] {
  flex: 1 1 220px; max-width: 360px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit;
}
.icon-btn {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 5px 9px; cursor: pointer; font: inherit;
}
.layout { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 58px); }
nav {
  border-right: 1px solid var(--line); padding: 12px 8px 40px;
  position: sticky; top: 58px; height: calc(100vh - 58px); overflow: auto;
}
nav .item {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--text);
}
nav .item:hover { background: var(--panel-2); }
nav .item.sel { background: color-mix(in srgb, var(--accent) 20%, transparent); }
nav .item .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
nav .year { font-weight: 650; margin-top: 8px; }
nav .video { padding-left: 18px; }
nav .module { padding-left: 32px; font-size: 13px; color: var(--muted); }
nav .module.sel { color: var(--text); }
main { padding: 16px 20px 60px; }
.summary { color: var(--muted); margin: 0 0 12px; }
.group-title { margin: 22px 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.group-title b { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
  transition: border-color .12s, transform .12s;
}
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.thumb { aspect-ratio: 16/9; background: #000; position: relative; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { color: #6b7280; font-size: 12px; padding: 10px; text-align: center; font-family: var(--mono); }
.thumb .dur {
  position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.72); color: #fff;
  font-size: 11px; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums;
}
.card .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
.card .name { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.card .where { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  padding: 1px 8px; border-radius: 999px; width: fit-content;
  border: 1px solid currentColor;
}
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

dialog {
  width: min(1100px, 96vw); max-height: 94vh; padding: 0; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel); color: var(--text);
}
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1;
}
.dlg-head h2 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.dlg-body { padding: 14px 16px 20px; overflow: auto; }
.dlg-body video { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; display: block; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 14px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.cmd {
  display: flex; gap: 8px; align-items: center; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0;
}
.cmd code { flex: 1; font-family: var(--mono); font-size: 12.5px; overflow-x: auto; white-space: nowrap; }
h3 { font-size: 13px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
pre {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; overflow: auto; font: 12px/1.5 var(--mono); margin: 0; max-height: 50vh;
}
pre .a { background: var(--add); display: block; }
pre .d { background: var(--del); display: block; }
pre .h { color: var(--accent); display: block; }
ul.changes { margin: 0; padding-left: 20px; }
ul.changes li { margin: 3px 0; }
.nav-btns { display: flex; gap: 6px; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { padding: 10px 16px; }
  main { padding: 12px 16px 40px; }
  .kv { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>3b1b → ManimGL <span>· index of converted scenes</span></h1>
  <div class="chips" id="chips"></div>
  <input type="search" id="q" placeholder="Search scene, file, note…">
  <a class="navlink" href="learning.html">Scenes to learn from →</a>
  <a class="navlink" href="skipped.html">Skipped scenes →</a>
  <button class="icon-btn" id="theme" title="Toggle theme">◐</button>
</header>
<div class="layout">
  <nav id="tree"></nav>
  <main>
    <p class="summary" id="summary"></p>
    <div id="groups"></div>
  </main>
</div>
<dialog id="dlg">
  <div class="dlg-head">
    <h2 id="dlg-title"></h2>
    <div class="nav-btns">
      <button class="icon-btn" id="prev" title="Previous (←)">←</button>
      <button class="icon-btn" id="next" title="Next (→)">→</button>
      <button class="icon-btn" id="close" title="Close (Esc)">✕</button>
    </div>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<script>
const CATALOG = /*__CATALOG__*/[];
// Prefix of the links to the .py files: "" next to the category folders, "../" in the repo's html/
const CODE_ROOT = "";
const CATS = [
  ["1", "Unmodified", "var(--c1)"],
  ["2", "Modified", "var(--c2)"],
  ["3", "Not rendering", "var(--c3)"],
  ["4a", "Interactive, runnable", "var(--c4a)"],
  ["4b", "Interactive, not runnable", "var(--c4b)"],
  ["error", "Failed (to review)", "var(--cerror)"],
  ["pending", "Pending", "var(--cpending)"],
  ["base", "Base class", "var(--cbase)"],
];
const CAT = Object.fromEntries(CATS.map(([k, label, color]) => [k, { label, color }]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const state = {
  cats: new Set(store.get("cats", ["1", "2", "3", "4a", "4b", "error", "pending"])),
  q: "",
  path: store.get("path", []),   // [year, video, module]
};
let visible = [];
let current = -1;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDur = s => s == null ? "" : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;

function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
applyTheme(store.get("theme", null));
document.getElementById("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? null : "light";
  applyTheme(next); store.set("theme", next);
};

function matchesPath(e) {
  const [y, v, m] = state.path;
  return (!y || e.year === y) && (!v || e.video === v) && (!m || e.module === m);
}
function matchesQuery(e) {
  if (!state.q) return true;
  const hay = [e.scene, e.source, e.notes, e.reason, e.interaction, ...(e.changes || [])].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}

function renderChips() {
  const base = CATALOG.filter(e => matchesPath(e) && matchesQuery(e));
  const counts = {};
  base.forEach(e => counts[e.category] = (counts[e.category] || 0) + 1);
  document.getElementById("chips").innerHTML = CATS.filter(([k]) => counts[k] || state.cats.has(k) && k !== "base").map(([k, label, color]) =>
    `<span class="chip ${state.cats.has(k) ? "" : "off"}" data-cat="${k}">
       <span class="dot" style="background:${color}"></span>${label}<span class="n">${counts[k] || 0}</span></span>`
  ).join("");
  document.querySelectorAll(".chip").forEach(ch => ch.onclick = () => {
    const k = ch.dataset.cat;
    state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k);
    store.set("cats", [...state.cats]);
    render();
  });
}

function renderTree() {
  const tree = {};
  CATALOG.filter(e => state.cats.has(e.category)).forEach(e => {
    const y = tree[e.year] ??= { n: 0, videos: {} };
    const v = y.videos[e.video] ??= { n: 0, modules: {} };
    y.n++; v.n++; v.modules[e.module] = (v.modules[e.module] || 0) + 1;
  });
  const [sy, sv, sm] = state.path;
  let html = `<div class="item ${!sy ? "sel" : ""}" data-path="[]"><span>All</span><span class="n">${CATALOG.filter(e => state.cats.has(e.category)).length}</span></div>`;
  const yearKey = y => /^\d+$/.test(y) ? -Number(y) : Infinity;
  Object.keys(tree).sort((a, b) => yearKey(a) - yearKey(b) || a.localeCompare(b)).forEach(y => {
    html += `<div class="item year ${sy === y && !sv ? "sel" : ""}" data-path='${JSON.stringify([y])}'><span>${esc(y)}</span><span class="n">${tree[y].n}</span></div>`;
    Object.keys(tree[y].videos).sort().forEach(v => {
      const vd = tree[y].videos[v];
      html += `<div class="item video ${sy === y && sv === v && !sm ? "sel" : ""}" data-path='${JSON.stringify([y, v])}'><span>${esc(v)}</span><span class="n">${vd.n}</span></div>`;
      if (sy === y && sv === v) {
        Object.keys(vd.modules).sort().forEach(m => {
          html += `<div class="item module ${sm === m ? "sel" : ""}" data-path='${JSON.stringify([y, v, m])}'><span>${esc(m)}.py</span><span class="n">${vd.modules[m]}</span></div>`;
        });
      }
    });
  });
  const nav = document.getElementById("tree");
  nav.innerHTML = html;
  nav.querySelectorAll(".item").forEach(it => it.onclick = () => {
    state.path = JSON.parse(it.dataset.path);
    store.set("path", state.path);
    render();
  });
}

function card(e, i) {
  const c = CAT[e.category];
  const thumb = e.thumb
    ? `<img loading="lazy" src="${esc(e.thumb)}" alt="" onerror="this.insertAdjacentHTML('afterend', '<div class=ph>no local render</div>'); this.remove()">`
    : `<div class="ph">${{ "3": "not rendering", pending: "not rendered yet", error: "failed, to review", "4b": "not runnable" }[e.category] || "no video"}</div>`;
  return `<div class="card" data-i="${i}">
    <div class="thumb">${thumb}${e.duration ? `<span class="dur">${fmtDur(e.duration)}</span>` : ""}</div>
    <div class="body">
      <div class="name">${esc(e.scene)}</div>
      <div class="where">${esc(e.video)} / ${esc(e.module)}.py</div>
      <span class="badge" style="color:${c.color}">${c.label}</span>
    </div></div>`;
}

function render() {
  renderChips();
  renderTree();
  visible = CATALOG.filter(e => state.cats.has(e.category) && matchesPath(e) && matchesQuery(e));
  document.getElementById("summary").textContent =
    `${visible.length} scenes · ${visible.filter(e => e.video_file || e.image_file).length} rendered · ${CATALOG.length} in total`;
  const groups = new Map();
  visible.forEach((e, i) => {
    const key = `${e.year} / ${e.video} / ${e.module}.py`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([e, i]);
  });
  const el = document.getElementById("groups");
  el.innerHTML = visible.length ? [...groups].map(([k, items]) =>
    `<div class="group-title"><b>${esc(k)}</b> · ${items.length}</div>
     <div class="grid">${items.map(([e, i]) => card(e, i)).join("")}</div>`
  ).join("") : `<div class="empty">Nothing matches the filters.</div>`;
  el.querySelectorAll(".card").forEach(c => c.onclick = () => open(+c.dataset.i));
}

function diffHtml(d) {
  return d.split("\n").map(l => {
    const cls = l.startsWith("+++") || l.startsWith("---") || l.startsWith("@@") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l) + "\n";
  }).join("");
}

function cmdRow(text) {
  return `<div class="cmd"><code>${esc(text)}</code><button class="icon-btn" data-copy="${esc(text)}">Copy</button></div>`;
}

function open(i) {
  current = i;
  const e = visible[i];
  const c = CAT[e.category];
  document.getElementById("dlg-title").innerHTML = `${esc(e.scene)} <span class="badge" style="color:${c.color};margin-left:8px">${c.label}</span>`;
  const dir = e.file ? e.file.split("/").slice(0, -1).join("/") : "";
  let h = "";
  if (e.video_file) h += `<video src="${esc(e.video_file)}" controls autoplay muted playsinline onerror="this.outerHTML='<p class=summary>There is no local render of this scene: run it with the command below, or download the renders (see the README) and put them in html/renders_3b1b/.</p>'"></video>`;
  else if (e.image_file) h += `<img src="${esc(e.image_file)}" alt="" style="width:100%;border-radius:8px;display:block"><p class="summary" style="margin-top:6px">Static scene (no animations): its only frame is shown.</p>`;
  h += `<dl class="kv">
    <dt>Original</dt><dd><code>videos/${esc(e.source)}</code> (lines ${e.lines[0]}–${e.lines[1]})</dd>
    ${e.file ? `<dt>File</dt><dd><a href="${esc(CODE_ROOT + e.file)}">${esc(e.file)}</a></dd>` : ""}
    ${e.duration ? `<dt>Duration</dt><dd>${fmtDur(e.duration)} · rendered in ${e.render_seconds}s</dd>` : ""}
    ${e.inlined_modules ? `<dt>Code copied from</dt><dd>${e.inlined_modules.map(esc).join(", ")}</dd>` : ""}
    ${e.packages ? `<dt>Extra packages</dt><dd>${e.packages.map(esc).join(", ")}</dd>` : ""}
  </dl>`;
  if (e.file) {
    h += `<h3>Run</h3>` + cmdRow(`cd "${dir}" && manimgl ${e.scene}.py ${e.scene} -w -m --fps 15`);
    if (e.category.startsWith("4")) h += cmdRow(`cd "${dir}" && manimgl ${e.scene}.py ${e.scene}`);
  }
  if (e.interaction) h += `<h3>How to interact</h3><pre>${esc(e.interaction)}</pre>`;
  if (e.changes) h += `<h3>Changes</h3><ul class="changes">${e.changes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (e.reason) h += `<h3>Why it does not render</h3><pre>${esc(e.reason)}</pre>`;
  if (e.notes) h += `<h3>Notes</h3><pre>${esc(e.notes)}</pre>`;
  if (e.diff) h += `<h3>Diff against the original</h3><pre>${diffHtml(e.diff)}</pre>`;
  if (e.error && !e.video_file) h += `<h3>Last error</h3><pre>${esc(e.error)}</pre>`;
  const body = document.getElementById("dlg-body");
  body.innerHTML = h;
  body.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200); }).catch(() => {});
  });
  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();
}

const dlg = document.getElementById("dlg");
document.getElementById("close").onclick = () => dlg.close();
document.getElementById("prev").onclick = () => current > 0 && open(current - 1);
document.getElementById("next").onclick = () => current < visible.length - 1 && open(current + 1);
dlg.addEventListener("close", () => { const v = dlg.querySelector("video"); if (v) v.pause(); });
dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); });
document.addEventListener("keydown", ev => {
  if (!dlg.open) return;
  if (ev.key === "ArrowLeft") document.getElementById("prev").click();
  if (ev.key === "ArrowRight") document.getElementById("next").click();
});
let qTimer;
document.getElementById("q").addEventListener("input", ev => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = ev.target.value.trim(); render(); }, 150);
});
render();
// Direct link: index.html#scene=SceneName
const linked = decodeURIComponent((location.hash.match(/scene=([^&]+)/) || [])[1] || "");
if (linked) {
  let i = visible.findIndex(e => e.scene === linked);
  if (i < 0) {
    state.path = []; state.cats = new Set(CATS.map(c => c[0])); render();
    i = visible.findIndex(e => e.scene === linked);
  }
  if (i >= 0) open(i);
}
</script>
</body>
</html>
